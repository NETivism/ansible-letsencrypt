---
  - name: Add jessie backports repository
    apt_repository:
      repo: deb http://ftp.debian.org/debian jessie-backports main
      state: present
    when:  (ansible_distribution == "Debian" and ansible_distribution_major_version == "8")
    tags: install
    become: yes

  - name: Install certbot pin on jessie-backports
    shell: apt-get install certbot -t jessie-backports
    when:  (ansible_distribution == "Debian" and ansible_distribution_major_version == "8")
    tags: install
    become: yes

  - name: Install certbot on stretch
    shell: apt-get install certbot --yes
    when:  (ansible_distribution == "Debian" and ansible_distribution_major_version == "9")
    tags: install
    become: yes

  - name: Install certbot on buster
    shell: apt-get install certbot --yes
    when:  (ansible_distribution == "Debian" and ansible_distribution_major_version == "10")
    tags: install
    become: yes

  # One task from bullseye on. The branches above differ in how certbot is
  # fetched; from 11 onwards it is a plain package in main, so naming 11, 12
  # and 13 separately is the same task three times and needs a fourth for the
  # next release. Debian 13 had no branch at all until 2026-08-21, which meant
  # the role installed no certbot on trixie and then went on to ask certbot
  # for a certificate anyway.
  - name: Install certbot on bullseye and newer
    when:  (ansible_distribution == "Debian" and
            ansible_distribution_major_version | int >= 11)
    become: yes
    apt:
      pkg: "certbot"
      state: present
    tags: install

  # The post-hook lives in a drop-in, not in the packaged unit file.
  # /lib/systemd/system belongs to the certbot package: an edit there holds
  # until the package is upgraded, and then dpkg restores its own copy and the
  # hook is gone without a word. Renewal still succeeds, nginx still serves
  # the old certificate until something happens to restart it.
  #
  # Measured 2026-08-21: vps-coolloud (bullseye, certbot 1.12.0) had the hook
  # and dpkg -V reported the unit modified. The same host, cloned and upgraded
  # to trixie (certbot 4.0.0), had the stock unit and a clean dpkg -V.
  - name: Certbot drop-in directory
    become: yes
    file:
      path: /etc/systemd/system/certbot.service.d
      state: directory
      mode: '0755'
    tags: install

  # The empty ExecStart= is required rather than decorative: certbot.service
  # is Type=oneshot, where repeated ExecStart= lines accumulate into a
  # sequence of commands. Without the reset this drop-in would add a second
  # certbot run instead of replacing the first.
  - name: Certbot post-hook as a drop-in that survives package upgrades
    become: yes
    copy:
      dest: /etc/systemd/system/certbot.service.d/override.conf
      mode: '0644'
      content: |
        [Service]
        ExecStart=
        ExecStart=/usr/bin/certbot -q renew --post-hook "/bin/systemctl restart nginx"
    tags: install

  - name: Realod systemd service
    become: yes
    command: systemctl daemon-reload
    tags: install

  - name: Ensure webroot exists
    file:
      path: "{{ letsencrypt_webroot_path }}"
      state: directory
      follow: yes
    become: yes

  - name: Attempt to get the certificate using the webroot authenticator
    command: "/usr/bin/letsencrypt -n --agree-tos --rsa-key-size 4096 --text -a webroot -w {{ letsencrypt_webroot_path }}/{{ item }} -d {{ item }} --email {{ letsencrypt_email }} {% if letsencrypt_server is defined %}--server {{ letsencrypt_server }}{% endif %} --expand certonly"
    become: yes
    args:
      creates: "/etc/letsencrypt/live/{{ item }}"
    with_items: "{{ letsencrypt_cert_domains }}"

